services:
  vlm-openvino-serving:
    image: intel/vlm-openvino-serving:1.3.1
    ports:
      - "8000"
    ipc: host
    networks:
      - scenescape
    environment:
      # Proxy settings
      no_proxy_env: ${no_proxy:-${NO_PROXY:-}},${HOST_IP}
      no_proxy: ${no_proxy:-${NO_PROXY:-}},${HOST_IP}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      # VLM Model configuration
      VLM_MODEL_NAME: ${VLM_MODEL_NAME:-Qwen/Qwen2.5-VL-3B-Instruct}
      VLM_COMPRESSION_WEIGHT_FORMAT: ${VLM_COMPRESSION_WEIGHT_FORMAT:-int4}
      VLM_DEVICE: ${VLM_DEVICE:-GPU}
      VLM_SEED: ${VLM_SEED:-42}
      WORKERS: ${VLM_WORKERS:-1}
      VLM_MAX_COMPLETION_TOKENS: ${VLM_MAX_COMPLETION_TOKENS:-500}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      OV_CONFIG: ${OV_CONFIG:-}
      VLM_LOG_LEVEL: ${VLM_LOG_LEVEL:-info}
      OPENVINO_LOG_LEVEL: ${VLM_OPENVINO_LOG_LEVEL:-1}
      VLM_ACCESS_LOG_FILE: ${VLM_ACCESS_LOG_FILE:-/dev/null}
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID:-1000} 
      - ${VIDEO_GROUP_ID:-44}    
      - ${RENDER_GROUP_ID:-109} 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    volumes:
      - ov-models:/root/.cache/huggingface
      - ov-models:/app/ov-model

  retail-agent:
    build:
      context: ${APP_DIR:-..}/src
      dockerfile: Dockerfile
    image: ${REGISTRY:-}retail-store-agent:${TAG:-latest}
    ports:
      - "${AGENT_BACKEND_PORT:-8081}:8081"
    networks:
      - scenescape
    depends_on:
      vlm-openvino-serving:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Proxy settings
      http_proxy: ${http_proxy}
      HTTP_PROXY: ${http_proxy}
      https_proxy: ${https_proxy}
      HTTPS_PROXY: ${https_proxy}
      no_proxy: ${no_proxy:-${NO_PROXY:-}},.scenescape.intel.com,${HOST_IP},broker.scenescape.intel.com,vlm-openvino-serving
      NO_PROXY: ${no_proxy:-${NO_PROXY:-}},.scenescape.intel.com,${HOST_IP},broker.scenescape.intel.com,vlm-openvino-serving
      
      # Store Configuration
      STORE_NAME: ${STORE_NAME:-retail_store_1}
      STORE_ID: ${STORE_ID:-store_001}
      NUM_CAMERAS: ${NUM_CAMERAS:-4}
      
      # MQTT configuration (connects to broker service)
      MQTT_HOST: ${MQTT_HOST:-broker.scenescape.intel.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      
      # VLM configuration (overrides src/config/retail_store_agent.json)
      VLM_MODEL_NAME: ${VLM_MODEL_NAME:-Qwen/Qwen2.5-VL-3B-Instruct}
      VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-}
      VLM_MAX_COMPLETION_TOKENS: ${VLM_MAX_COMPLETION_TOKENS:-500}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-}
      VLM_TOP_P: ${VLM_TOP_P:-}
    volumes:
      - ${APP_DIR:-..}/src/config:/app/config:ro
      - retail-agent-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10s}
    restart: unless-stopped

  register_employee:
    build:
      context: ${APP_DIR:-..}/src
      dockerfile: Dockerfile
    image: ${REGISTRY:-}retail-store-agent-employee-register:${TAG:-latest}
    networks:
      - scenescape
    command: ["python", "/app/register_employee.py"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Proxy settings
      http_proxy: ${http_proxy}
      HTTP_PROXY: ${http_proxy}
      https_proxy: ${https_proxy}
      HTTPS_PROXY: ${https_proxy}
      no_proxy: ${no_proxy:-${NO_PROXY:-}},.scenescape.intel.com,${HOST_IP},broker.scenescape.intel.com
      NO_PROXY: ${no_proxy:-${NO_PROXY:-}},.scenescape.intel.com,${HOST_IP},broker.scenescape.intel.com
      
      # MQTT configuration
      MQTT_HOST: ${MQTT_HOST:-broker.scenescape.intel.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USE_TLS: ${MQTT_USE_TLS:-true}
      MQTT_CA_CERT_PATH: ${MQTT_CA_CERT_PATH:-/run/secrets/certs/scenescape-ca.pem}
      MQTT_CERT_REQUIRED: ${MQTT_CERT_REQUIRED:-false}
      MQTT_VERIFY_HOSTNAME: ${MQTT_VERIFY_HOSTNAME:-false}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    volumes:
      - ${SCENESCAPE_CERTS_DIR:-../../scenescape/manager/secrets/certs}:/run/secrets/certs:ro
    restart: unless-stopped

  nodered:
    build:
      context: ${APP_DIR:-..}/nodered
      dockerfile: Dockerfile
    image: ${REGISTRY:-}retail-store-nodered:${TAG:-latest}
    ports:
      - "${NODERED_PORT:-1880}:1880"
    networks:
      - scenescape
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${SCENESCAPE_CERTS_DIR:-../../scenescape/manager/secrets/certs}:/run/secrets/certs:ro
    restart: unless-stopped

volumes:
  ov-models:
  retail-agent-data:

networks:
  scenescape:
    name: scenescape_scenescape
    external: true
