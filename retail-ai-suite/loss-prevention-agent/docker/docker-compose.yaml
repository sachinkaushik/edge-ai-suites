services:
  # ---------- VLM serving (shared with smart-retail-agent pattern) ----------
  vlm-openvino-serving:
    image: intel/vlm-openvino-serving:1.3.1
    ports:
      - "8000"
    ipc: host
    networks:
      - scenescape
    environment:
      no_proxy_env: ${no_proxy:-${NO_PROXY:-}},${HOST_IP}
      no_proxy: ${no_proxy:-${NO_PROXY:-}},${HOST_IP}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME:-Qwen/Qwen2.5-VL-3B-Instruct}
      VLM_COMPRESSION_WEIGHT_FORMAT: ${VLM_COMPRESSION_WEIGHT_FORMAT:-int4}
      VLM_DEVICE: ${VLM_DEVICE:-GPU}
      VLM_SEED: ${VLM_SEED:-42}
      WORKERS: ${VLM_WORKERS:-1}
      VLM_MAX_COMPLETION_TOKENS: ${VLM_MAX_COMPLETION_TOKENS:-500}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      VLM_LOG_LEVEL: ${VLM_LOG_LEVEL:-info}
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID:-1000}
      - ${VIDEO_GROUP_ID:-44}
      - ${RENDER_GROUP_ID:-109}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    volumes:
      - ov-models:/root/.cache/huggingface
      - ov-models:/app/ov-model

  # ---------- MinIO object storage ----------
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - scenescape
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Loss Prevention Agent ----------
  loss-prevention-agent:
    build:
      context: ${APP_DIR:-..}/src
      dockerfile: Dockerfile
    image: ${REGISTRY:-}loss-prevention-agent:${TAG:-latest}
    ports:
      - "${LP_AGENT_PORT:-8082}:8082"
    networks:
      - scenescape
    depends_on:
      vlm-openvino-serving:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy:-${NO_PROXY:-}},.scenescape.intel.com,${HOST_IP},broker.scenescape.intel.com,vlm-openvino-serving,minio
      # Store
      STORE_NAME: ${STORE_NAME:-retail_store_1}
      STORE_ID: ${STORE_ID:-store_001}
      # MQTT
      MQTT_HOST: ${MQTT_HOST:-broker.scenescape.intel.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # SceneScape API (for zone auto-discovery)
      SCENESCAPE_API_USER: ${SCENESCAPE_API_USER:-}
      SCENESCAPE_API_PASSWORD: ${SCENESCAPE_API_PASSWORD:-}
    volumes:
      - ../secrets:/app/secrets:ro
    restart: unless-stopped

networks:
  scenescape:
    name: scenescape_scenescape
    external: true

volumes:
  ov-models:
  minio-data:
